name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:contrast
      - run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # این تست‌ها خودشان با APP_BASE=/ می‌سازند و dist را بازنویسی می‌کنند؛
      # پس باید پیش از ساخت نسخهٔ Pages اجرا شوند، وگرنه خروجی آپلودشده
      # نسخهٔ ریشهٔ دامنه می‌شود و Pages خراب می‌شود.
      - name: PWA and offline tests
        run: npx playwright test
      - name: Build for GitHub Pages
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
